<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengukuran Waktu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .timer-display {
            background: #f5f5f5;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .time {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .btn-start {
            background: #667eea;
            color: white;
        }
        
        .btn-start:hover {
            background: #5568d3;
        }
        
        .btn-stop {
            background: #ff6b6b;
            color: white;
        }
        
        .btn-stop:hover {
            background: #ee5a52;
        }
        
        .btn-reset {
            background: #51cf66;
            color: white;
        }
        
        .btn-reset:hover {
            background: #40c057;
        }
        
        .info {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 4px;
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏱️ Pengukuran Waktu</h1>
        <p class="subtitle">Aplikasi Stopwatch Sederhana</p>
        
        <div class="timer-display">
            <div class="time" id="display">00:00:00</div>
        </div>
        
        <div class="controls">
            <button class="btn-start" onclick="startTimer()">Mulai</button>
            <button class="btn-stop" onclick="stopTimer()">Henti</button>
            <button class="btn-reset" onclick="resetTimer()">Reset</button>
        </div>
        
        <div class="info">
            <strong>📌 Cara Menggunakan:</strong><br>
            1. Klik tombol "Mulai" untuk memulai pengukuran waktu<br>
            2. Klik tombol "Henti" untuk menghentikan<br>
            3. Klik tombol "Reset" untuk mengulang dari nol
        </div>
    </div>

    <script>
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let isRunning = false;

        function startTimer() {
            if (!isRunning) {
                startTime = Date.now() - elapsedTime;
                timerInterval = setInterval(updateDisplay, 10);
                isRunning = true;
            }
        }

        function stopTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            startTime = 0;
            elapsedTime = 0;
            isRunning = false;
            document.getElementById('display').textContent = '00:00:00';
        }

        function updateDisplay() {
            elapsedTime = Date.now() - startTime;
            
            const totalSeconds = Math.floor(elapsedTime / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            
            const display = 
                String(hours).padStart(2, '0') + ':' +
                String(minutes).padStart(2, '0') + ':' +
                String(seconds).padStart(2, '0');
            
            document.getElementById('display').textContent = display;
        }
    </script>
</body>
</html>
